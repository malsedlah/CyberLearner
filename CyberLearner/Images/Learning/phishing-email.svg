  <text x="34" y="264" font-family="Arial" font-size="12" fill="#1f2933">Bank Security Team</text>
  <circle cx="372" cy="76" r="11" fill="#c62828" />
  <text x="372" y="81" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="390" y="81" font-family="Arial" font-size="12" fill="#c62828">Fake address</text>
  <circle cx="372" cy="98" r="11" fill="#c62828" />
  <text x="372" y="103" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="390" y="103" font-family="Arial" font-size="12" fill="#c62828">Urgent language</text>
  <circle cx="372" cy="136" r="11" fill="#c62828" />
  <text x="372" y="141" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="390" y="141" font-family="Arial" font-size="12" fill="#c62828">General greeting</text>
  <circle cx="372" cy="160" r="11" fill="#c62828" />
  <text x="372" y="165" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="390" y="165" font-family="Arial" font-size="12" fill="#c62828">Spelling mistake</text>
  <circle cx="372" cy="219" r="11" fill="#c62828" />
