  <text x="34" y="140" font-family="Arial" font-size="12" fill="#1f2933">Dear Customer,</text>
  <text x="34" y="164" font-family="Arial" font-size="12" fill="#1f2933">Your acount will be closed in 24 hours.</text>
  <text x="34" y="184" font-family="Arial" font-size="12" fill="#1f2933">Click the link below to verify now.</text>
  <rect x="34" y="204" width="150" height="30" rx="4" fill="#1565c0" />
